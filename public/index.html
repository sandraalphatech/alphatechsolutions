<script>
/* ============ constantes ============ */
const KEY = "alphaleads.v1";
const SEG = {clinica:"Clínica / saúde",advocacia:"Advocacia",clima:"Climatização",estetica:"Estética / beleza",loja:"Loja online / criador",b2b:"Agência / B2B",outro:"Outro"};
const SIG = {inbound:["Pediu contacto pelo site",6],asked:["Pediu o serviço publicamente",6],nosite:["Não tem site",3],slowsite:["Site lento ou desatualizado",2],igonly:["Só Instagram ou WhatsApp",2],newbiz:["Empresa aberta há menos de 12 meses",2],reviews:["Muitas avaliações no Google",1],prosite:["Já tem site profissional",-3]};
const STAT = {novo:"Novo",contactado:"Contactado",reuniao:"Reunião marcada",proposta:"Proposta enviada",negociacao:"Negociação",ganho:"Ganho",perdido:"Perdido"};
const FOLLOW_DAYS = 5, MAX_FOLLOWUPS = 2;

/* ============ estado ============ */
let S = emptyState(), started = false;
const ui = { radar:{ market:"PT", city:"", seg:"clinica", mobile:true, withSite:false, results:null, sel:{}, busy:false, info:"" }, tab:"painel", drill:"acao", trackView:"board", src:{ market:"PT", svc:"site", period:"w" }, trackStage:"ALL", market:"ALL", segment:"ALL", q:"", status:"ALL", showAll:false };
function emptyState(){ return { leads:[], optout:[], log:[], settings:{daily:25,sender:"Sandra"}, radar:{ searches:[], lastRun:"", max:20, auto:true } }; }
function normalize(d){
  const e = emptyState(), o = Object.assign(e, d || {});
  o.settings = Object.assign({daily:25,sender:"Sandra"}, (d && d.settings) || {});
  o.radar = Object.assign({ searches: [], lastRun: "", max: 20, auto: true }, (d && d.radar) || {});
  return o;
}
/* ---- gravação na base de dados (Supabase). Nada de dados no navegador, só a sessão ---- */
const TBL = "/rest/v1/panel_state";
let rev = 0, dirty = false, pushing = false, pushTimer = null, locked = false;
function setSaveState(kind, txt){ const e = $("#saveState"); if (!e) return; e.className = kind || ""; e.textContent = txt; }
function save(){ ensureHistory(); if (locked) return; dirty = true; setSaveState("busy", "A guardar…"); clearTimeout(pushTimer); pushTimer = setTimeout(push, 700); }
async function push(){
  if (pushing || !dirty || locked) return; pushing = true; dirty = false;
  try {
    const token = await sbToken(), { url } = sbCfg();
    const r = await fetch(url + TBL + "?id=eq.main&rev=eq." + rev, { method: "PATCH", headers: Object.assign({ Prefer: "return=representation" }, sbHeaders(token)), body: JSON.stringify({ data: S, rev: rev + 1, updated_at: new Date().toISOString() }) });
    if (r.status === 401 || r.status === 403) throw Object.assign(new Error("auth"), { auth: true });
    if (!r.ok) throw new Error("O servidor recusou a gravação (" + r.status + ").");
    const rows = await r.json();
    if (!rows.length) { locked = true; setSaveState("bad", "Conflito"); showConflict(); return; }
    rev = rows[0].rev; setSaveState("", dirty ? "A guardar…" : "Guardado");
  } catch (e) {
    dirty = true;
    if (e.auth || /sess/i.test(e.message)) { setSaveState("bad", "Sessão expirada"); showGate("A sessão expirou. Entre outra vez: nada foi perdido."); }
    else { setSaveState("bad", "Não guardado"); clearTimeout(pushTimer); pushTimer = setTimeout(push, 8000); }
  } finally { pushing = false; if (dirty && !locked && !pushTimer) pushTimer = setTimeout(push, 700); }
}
function showConflict(){
  const g = $("#gate"); g.classList.remove("hidden");
  g.innerHTML = '<form id="cf"><div class="brandc"><h1>Dados alterados noutro local</h1><p>Esta página ficou desatualizada porque guardou alterações noutro dispositivo ou separador. Para não perder nada, recarregue os dados do servidor.</p></div><button type="submit">Recarregar dados</button></form>';
  $("#cf").onsubmit = e => { e.preventDefault(); location.reload(); };
}
async function loadRemote(){
  const token = await sbToken(), { url } = sbCfg(), H = sbHeaders(token);
  const r = await fetch(url + TBL + "?id=eq.main&select=data,rev", { headers: H });
  if (!r.ok) throw new Error(r.status === 404 ? "Falta criar a tabela. Execute supabase/panel_state.sql no Supabase." : "Não foi possível ler os dados (" + r.status + ").");
  let rows = await r.json();
  if (!rows.length) {
    let seed = emptyState();
    try { const old = JSON.parse(localStorage.getItem(KEY)); if (old && old.leads && old.leads.length && confirm("Encontrei dados antigos guardados neste navegador. Quer enviá-los para a base de dados?")) seed = normalize(old); } catch (e) {}
    const c = await fetch(url + TBL, { method: "POST", headers: Object.assign({ Prefer: "return=representation" }, H), body: JSON.stringify({ id: "main", data: seed, rev: 0 }) });
    if (!c.ok) throw new Error("Não foi possível criar o registo (" + c.status + ").");
    rows = await c.json();
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
  S = normalize(rows[0].data); rev = rows[0].rev;
}

function sendGate(l){
  const t = today();
  if (isOpt(l)) return { ok: false, reason: "Esta empresa pediu para não ser contactada." };
  if (l.status === "novo") {
    if (l.inbound) return { ok: true, kind: "reply" };
    const r = !l.reactivated && registryFind(l);
    if (r) return { ok: false, reason: `Esta empresa já foi contactada em ${fmtD(r.last)}${r.n > 1 ? " (" + r.n + " mensagens)" : ""}. Para não a incomodar, o reenvio não é permitido.` };
    return { ok: true, kind: "first" };
  }
  if (l.status === "contactado" && l.replyResult === "sim") return { ok: true, kind: "chat" };
  if (l.status === "contactado") {
    if ((l.followups || 0) >= MAX_FOLLOWUPS) return { ok: false, reason: "Já enviou o máximo de follow-ups a esta empresa. Aguarde resposta: se não houver, é arquivada como 'Sem resposta'." };

  if (["reuniao", "proposta", "negociacao", "ganho"].includes(l.status)) return { ok: true, kind: "chat" };
  if (l.blockedUntil && l.blockedUntil > t) return { ok: false, reason: `Ciclo concluído (${l.lostReason || STAT[l.status]}). Só volta a poder contactar esta empresa a partir de ${fmtD(l.blockedUntil)}.` };

/* ---- lembretes (4 regras, prazos configuráveis) e autonomia ---- */
const REM_DEFAULT = { noContact: 3, proposal: 7, meetingAhead: 1, runwayWarn: 6, minLeads: 5 };
const remCfg = () => Object.assign({}, REM_DEFAULT, S.settings.rem || {});
function computeReminders(){
  const c = remCfg(), t = today(), out = { noContact: [], proposal: [], meeting: [], follow: [] };
  for (const l of S.leads) {
    if (l.demo || isOpt(l) || !ACTIVE.includes(l.status)) continue;
    const last = l.lastContact || l.firstContact || l.created, conv = l.status !== "contactado" || l.replyResult === "sim";
    if (l.status === "proposta") {
      const since = l.proposalAt || last;
      if (since && daysAgo(since) >= c.proposal) { out.proposal.push({ l, text: `Proposta sem resposta há ${daysAgo(since)} dias` }); continue; }
    }
    if (l.status === "reuniao" && l.meetingAt) {
      const diff = -daysAgo(l.meetingAt);
      if (diff < 0) out.meeting.push({ l, text: `A reunião era a ${fmtT(l.meetingAt)}: registe o resultado` });
      else if (diff === 0) out.meeting.push({ l, text: `Reunião hoje, ${fmtT(l.meetingAt).slice(11)}` });
      else if (diff === c.meetingAhead) out.meeting.push({ l, text: diff === 1 ? `Reunião amanhã, ${fmtT(l.meetingAt).slice(11)}` : `Reunião em ${diff} dias` });
    }
    if (l.status === "contactado" && !l.replyResult && l.nextContact && l.nextContact <= t && (l.followups || 0) < MAX_FOLLOWUPS) { out.follow.push({ l, text: "Follow-up necessário" }); continue; }
    if (conv && last && daysAgo(last) >= c.noContact && !out.meeting.some(x => x.l === l)) out.noContact.push({ l, text: `Sem contacto há ${daysAgo(last)} dias` });

}

function autonomy(){

    const start = l.deal.start || l.wonAt || t, elapsed = Math.max(0, (new Date(t + "T12:00:00") - new Date(start + "T12:00:00")) / 604800000);
    const left = Math.max(0, +l.deal.weeks - elapsed); if (left > 0) { weeks += left; projects++; }

/* ============ CSV ============ */
function parseCsv(text){
  const first = text.split(/\r?\n/)[0] || ""; const d = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === d) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row); return rows;
}
const ALIAS = { name:["nome","name","empresa","negocio","negócio"], phone:["telefone","phone","telemovel","telemóvel","whatsapp","celular","tel"], site:["site","website","url","web"], instagram:["instagram","ig"], city:["cidade","city","localidade"], segment:["segmento","segment","categoria","category"], market:["mercado","market","pais","país"], source:["fonte","source","prova","link"], signals:["sinais","signals"], notes:["notas","notes","obs"] };
function guessSeg(t){
  t = (t || "").toLowerCase();
  if (SEG[t]) return t;
  t = t.normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (/clin|saude|dent|medic|nutri|psic|fisio|odonto/.test(t)) return "clinica";
  if (/advog|advoc|jurid|law/.test(t)) return "advocacia";
  if (/climat|ar.?condicionado|hvac/.test(t)) return "clima";
  if (/estet|beleza|salao|cabel|unhas|barbe/.test(t)) return "estetica";
  if (/loja|store|shop|ecommerce|e-commerce/.test(t)) return "loja";
  if (/agencia|b2b|software/.test(t)) return "b2b";
  return "outro";
}
function doImport(){
  const text = $("#csvText").value.trim(); if (!text) return toast("Cole ou escolha um CSV primeiro.");
  const rows = parseCsv(text); if (rows.length < 2) return toast("O CSV precisa de cabeçalho e pelo menos uma linha.");
  const head = rows[0].map(h => h.trim().toLowerCase()), idx = {};
  for (const [k, al] of Object.entries(ALIAS)) idx[k] = head.findIndex(h => al.includes(h));
  if (idx.name < 0) return toast("Falta a coluna 'nome'.");
  const defMarket = $("#csvMarket").value; let add = 0, dup = 0, blocked = 0;
  for (const r of rows.slice(1)) {
    const g = k => idx[k] >= 0 ? (r[idx[k]] || "").trim() : "";
    const name = g("name"); if (!name) continue;
    const mk = /^br/i.test(g("market")) ? "BR" : /^pt/i.test(g("market")) ? "PT" : defMarket;
    const phone = normPhone(g("phone"), mk), key = phone || (name + "|" + g("city")).toLowerCase();
    if (S.optout.some(o => o.phone && phone && o.phone === phone)) { blocked++; continue; }
    if (knownLead({ name, phone, site: g("site"), instagram: g("instagram"), city: g("city") })) { dup++; continue; }
    const signals = new Set(g("signals").split(/[|,]/).map(x => x.trim().toLowerCase()).filter(x => SIG[x]));
    const site = g("site"), ig = g("instagram");
    if (!site) signals.add("nosite");
    if (!site && ig) signals.add("igonly");
    S.leads.push({ id: uid(), name, phone, site, instagram: ig, city: g("city"), market: mk, segment: guessSeg(g("segment")), source: g("source"), notes: g("notes"), signals: [...signals], status: "novo", followups: 0, created: today() });
    add++;
  }
  save(); ui.tab = "hoje"; render(); toast(`Importados ${add}. Repetidos: ${dup}. Na lista "Não contactar": ${blocked}.`);
}
function exportCsv(){
  const rows = S.leads.map(l => ({ empresa: l.name, fonte: SRC[fonteOf(l)] || "", telefone: l.phone ? "+" + l.phone : "", cidade: l.city || "", mercado: l.market, segmento: SEG[l.segment] || "", estado: STAT[l.status] || l.status, primeiro_contacto: l.firstContact || "", ultimo_contacto: l.lastContact || "", mensagens: msgCount(l), resposta: replyLabel(l), motivo: l.lostReason || "", descanso_ate: l.blockedUntil || "", proximo_followup: l.nextContact || "", reuniao: l.meetingAt || "", proposta_enviada: l.proposalAt || "", valor: l.deal && l.deal.value !== undefined ? l.deal.value : "", semanas: l.deal && l.deal.weeks !== undefined ? l.deal.weeks : "", fonte: l.source || "", site: l.site || "", notas: l.notes || "", historico: (l.history || []).map(h => `${fmtT(h.t)} ${HTYPE[h.type] || h.type}${h.text ? ": " + h.text : ""}`).join(" | ") }));
  const cols = Object.keys(rows[0] || { empresa: "" }), q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  download("leads-historico-" + today() + ".csv", cols.join(";") + "\n" + rows.map(r => cols.map(c => q(r[c])).join(";")).join("\n"), "text/csv");
}

/* ============ radar: encontra empresas (OpenStreetMap / Overpass) ============ */
const RADAR_SEG = {
  clinica: 'nwr["amenity"~"^(dentist|clinic|doctors)$"](area.a);nwr["healthcare"~"^(dentist|clinic|doctor|physiotherapist|psychotherapist)$"](area.a);',
  advocacia: 'nwr["office"="lawyer"](area.a);',
  estetica: 'nwr["shop"~"^(beauty|hairdresser)$"](area.a);nwr["beauty"](area.a);',
  clima: 'nwr["craft"="hvac"](area.a);nwr["shop"="hvac"](area.a);'
};
const PUBLIC_RE = /(centro de sa[uú]de|hospital|\bsns\b|c[aâ]mara municipal|junta de freguesia|\busf\b|\bucsp\b|prefeitura|posto de sa[uú]de|\bubs\b|\bupa\b|santa casa|cruz vermelha|bombeiros)/i;
function radarQuery(market, city, seg){
  const cc = market === "BR" ? "BR" : "PT", lvl = market === "BR" ? "8" : "7", c = String(city).replace(/["\\]/g, "").trim();
  return `[out:json][timeout:60];area["ISO3166-1"="${cc}"]->.c;area["name"~"^${c}$",i]["boundary"="administrative"]["admin_level"="${lvl}"](area.c)->.a;(${RADAR_SEG[seg]});out tags center 500;`;
}
async function overpass(q){
  const eps = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]; let last;
  for (const ep of eps) {
    try {
      const r = await fetch(ep, { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:"data=" + encodeURIComponent(q) });
      if (r.ok) { const j = await r.json(); return j.elements || []; }
      last = new Error("O servidor de mapas respondeu " + r.status + ".");
    } catch (e) { last = e; }
  }
  throw last || new Error("Sem resposta do servidor de mapas.");
}
function pickPhone(raw, market){
  const list = String(raw || "").split(/[;,\/]/).map(x => normPhone(x, market)).filter(Boolean);
  return list.find(p => !likelyLandline(p, market)) || list[0] || "";
}
function osmCandidates(els, market, seg, city){
  const out = [];
  for (const e of els) {
    const t = e.tags || {}, name = (t.name || "").trim(); if (!name || PUBLIC_RE.test(name)) continue;
    const phone = pickPhone(t.phone || t["contact:phone"] || t.mobile || t["contact:mobile"], market);
    const site = t.website || t["contact:website"] || t.url || "", ig = t["contact:instagram"] || t.instagram || "";
    const signals = []; if (!site) signals.push("nosite"); if (!site && ig) signals.push("igonly");
    out.push({ osm: e.type + "/" + e.id, name, phone, mobile: !!phone && !likelyLandline(phone, market), site, instagram: ig, city: t["addr:city"] || city, market, segment: seg, signals, source: "https://www.openstreetmap.org/" + e.type + "/" + e.id });
  }
  return out;
}
/* knownLead: ver bloco "histórico, registo de contactos e regras anti-reenvio" */
function radarFilter(cands, o){
  let drop = { semTel: 0, fixo: 0, comSite: 0, jaTenho: 0 }; const keep = [];
  for (const c of cands) {
    if (!c.phone) { drop.semTel++; continue; }
    if (o.mobile && !c.mobile) { drop.fixo++; continue; }
    if (c.site && !o.withSite) { drop.comSite++; continue; }
    if (knownLead(c)) { drop.jaTenho++; continue; }
    keep.push(c);
  }
  const seen = new Set(); return { keep: keep.filter(c => !seen.has(c.phone) && seen.add(c.phone)), drop };
}
function addCandidate(c){
  S.leads.push({ id: uid(), radar: true, osm: c.osm, name: c.name, phone: c.phone, site: c.site, instagram: c.instagram, city: c.city, market: c.market, segment: c.segment, signals: c.signals, source: c.source, notes: "Encontrado no Radar (OpenStreetMap). Confirme no Google que não tem site antes de enviar.", status: "novo", followups: 0, created: today() });
}

    const els = await overpass(radarQuery(r.market, r.city, r.seg)), cands = osmCandidates(els, r.market, r.seg, r.city.trim()), f = radarFilter(cands, r);
    r.results = f.keep; r.sel = {}; f.keep.forEach(c => r.sel[c.osm] = true);

    <table><thead><tr><th></th><th>Empresa</th><th>Telefone</th><th>Sinais</th><th></th></tr></thead><tbody>${rs.map(c => `<tr><td><input type="checkbox" data-sel="${esc(c.osm)}" ${r.sel[c.osm]?"checked":""} style="width:auto"></td><td><b>${esc(c.name)}</b><br><span class="note">${esc(c.city || "")}${c.instagram ? " · " + esc(c.instagram) : ""}</span></td><td>${esc("+" + c.phone)}</td><td>${c.signals.map(k => `<span class="tag">${esc(SIG[k][0])}</span>`).join("") || '<span class="note">—</span>'}</td><td><a href="https://www.google.com/search?q=${encodeURIComponent(c.name + " " + (c.city || ""))}" target="_blank" rel="noopener">Google</a></td></tr>`).join("")}</tbody></table>`;
  }
  h += `<div class="card"><h3 style="margin-top:0">Radar diário (automático)</h3>
    <p class="note">Guarde pesquisas e, ao abrir o painel de manhã, ele corre-as sozinho e deixa os novos leads prontos em "Hoje". Máximo de novos por dia: <input type="number" id="rMax" min="5" max="60" value="${S.radar.max}" style="width:80px;display:inline-block"> <label style="display:inline-flex;gap:6px;align-items:center;margin-left:10px"><input type="checkbox" id="rAuto" ${S.radar.auto?"checked":""} style="width:auto"> Ligado</label></p>
    ${S.radar.searches.length ? `<table><tbody>${S.radar.searches.map((x, i) => `<tr><td>${x.market === "BR" ? "Brasil" : "Portugal"}</td><td><b>${esc(x.city)}</b></td><td>${esc(SEG[x.seg])}</td><td>${x.mobile ? "só telemóvel" : "todos"}${x.withSite ? ", com site" : ""}</td><td><button class="b bad" data-rmsearch="${i}">Remover</button></td></tr>`).join("")}</tbody></table>
    <div class="actions"><button class="b" id="rRunNow">Correr o Radar agora</button><span class="note" style="align-self:center">Última execução: ${esc(S.radar.lastRun || "nunca")}</span></div>` : '<p class="note">Ainda não há pesquisas guardadas.</p>'}</div>`;
  return h;
}
function bindRadar(){
  const r = ui.radar, g = (id, fn) => { const e = $("#" + id); if (e) e.onclick = fn; };
  const m = $("#rMarket"); if (!m) { g("rRunNow", () => autoRadar(true)); return; }
  m.onchange = () => { r.market = m.value; };
  $("#rCity").oninput = e => { r.city = e.target.value; };
  $("#rCity").onkeydown = e => { if (e.key === "Enter") runRadar(); };
  $("#rSeg").onchange = e => { r.seg = e.target.value; };
  $("#rMobile").onchange = e => { r.mobile = e.target.checked; };
  $("#rSite").onchange = e => { r.withSite = e.target.checked; };
  g("rGo", runRadar);
  g("rSave", () => {
    if (!r.city.trim()) return toast("Escreva a cidade primeiro.");
    if (S.radar.searches.some(x => x.market === r.market && x.city.toLowerCase() === r.city.trim().toLowerCase() && x.seg === r.seg)) return toast("Essa pesquisa já está guardada.");
    S.radar.searches.push({ market: r.market, city: r.city.trim(), seg: r.seg, mobile: r.mobile, withSite: r.withSite }); save(); render(); toast("Pesquisa guardada. Corre sozinha ao abrir o painel.");
  });
  g("rAdd", () => { const sel = (r.results || []).filter(c => r.sel[c.osm]); sel.forEach(addCandidate); r.results = (r.results || []).filter(c => !r.sel[c.osm]); save(); ui.tab = "hoje"; render(); toast(`${sel.length} leads adicionados a "Hoje".`); });
  g("rAll", () => { (r.results || []).forEach(c => r.sel[c.osm] = true); render(); });
  g("rNone", () => { r.sel = {}; render(); });
  $$("[data-sel]").forEach(c => c.onchange = () => { r.sel[c.dataset.sel] = c.checked; const b = $("#rAdd"); const n = Object.values(r.sel).filter(Boolean).length; if (b) { b.textContent = `Adicionar ${n} selecionados à lista Hoje`; b.disabled = !n; } });
  $$("[data-rmsearch]").forEach(b => b.onclick = () => { S.radar.searches.splice(+b.dataset.rmsearch, 1); save(); render(); });
  const mx = $("#rMax"); if (mx) mx.onchange = () => { S.radar.max = Math.max(5, Math.min(60, +mx.value || 20)); save(); };
  const au = $("#rAuto"); if (au) au.onchange = () => { S.radar.auto = au.checked; save(); };
  g("rRunNow", () => autoRadar(true));
}
let radarRunning = false;
async function autoRadar(manual){
  if (radarRunning || !S.radar.searches.length) return; if (!manual && (!S.radar.auto || S.radar.lastRun === today())) return;
  radarRunning = true; let added = 0, errors = 0;
  try {
    for (const x of S.radar.searches) {
      if (added >= S.radar.max) break;
      try {
        const els = await overpass(radarQuery(x.market, x.city, x.seg)), f = radarFilter(osmCandidates(els, x.market, x.seg, x.city), x);
        for (const c of f.keep) { if (added >= S.radar.max) break; addCandidate(c); added++; }
      } catch (e) { errors++; }
      await new Promise(r => setTimeout(r, 1500));
    }
    if (errors < S.radar.searches.length) S.radar.lastRun = today();
    save(); render();
    toast(added ? `Radar: ${added} novos leads prontos em "Hoje".` : errors ? "Radar: o servidor de mapas não respondeu. Tente mais tarde." : "Radar: sem novos leads hoje.");
  } finally { radarRunning = false; }
}

/* ============ ligação ao site (Supabase, só REST) ============ */
const SB_DEFAULT_URL = "https://ampivgjlgdlkazfpckdb.supabase.co", SESS = "alphaleads.session";
let syncing = false;
const SB_DEFAULT_KEY = "sb_publishable_8sJQyuckXuPX7Nuwte_OXw_djMdivuo";
const sbCfg = () => ({ url: (S.settings.sbUrl || SB_DEFAULT_URL).replace(/\/+$/, ""), key: S.settings.sbKey || SB_DEFAULT_KEY });
const getSess = () => { try { return JSON.parse(localStorage.getItem(SESS)); } catch (e) { return null; } };
function putSess(j){
  if (!j) { localStorage.removeItem(SESS); return; }
  const old = getSess() || {};
  localStorage.setItem(SESS, JSON.stringify({ access: j.access_token, refresh: j.refresh_token, exp: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: (j.user && j.user.email) || old.email || "" }));
}
function sbHeaders(token){
  const { key } = sbCfg(), h = { apikey: key, "Content-Type": "application/json" };
  if (token) h.Authorization = "Bearer " + token; else if (key.startsWith("eyJ")) h.Authorization = "Bearer " + key;
  return h;
}
async function sbLogin(email, pass){
  const { url, key } = sbCfg(); if (!key) throw new Error("Falta a chave pública.");
  const r = await fetch(url + "/auth/v1/token?grant_type=password", { method: "POST", headers: sbHeaders(), body: JSON.stringify({ email, password: pass }) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error_description || j.msg || "Não foi possível entrar. Confirme o e-mail e a palavra-passe.");
  putSess(j);
}
async function sbToken(){
  if (!getSess()) throw new Error("Sem sessão.");
  const s = getSess(); if (!s) throw new Error("Sem sessão.");
  if (s.exp - 60 > Math.floor(Date.now() / 1000)) return s.access;
  const { url } = sbCfg();
  const r = await fetch(url + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: sbHeaders(), body: JSON.stringify({ refresh_token: s.refresh }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { putSess(null); throw new Error("A sessão expirou."); }
  putSess(j); return j.access_token;
}
async function syncInbound(manual){
  if (syncing) return; const { url, key } = sbCfg();
  if (!key || !getSess()) { if (manual) toast("Ligue primeiro o site em Definições."); return; }
  syncing = true; $("#syncBtn").textContent = "A sincronizar…";
  try {
    const token = await sbToken(), H = sbHeaders(token);
    const r = await fetch(url + "/rest/v1/inbound_leads?imported_at=is.null&select=*&order=created_at.asc&limit=200", { headers: H });
    if (!r.ok) throw new Error("O servidor recusou a leitura (" + r.status + "). Confirme se executou o script SQL e se o e-mail é o autorizado.");
    const rows = await r.json(); let added = 0;
    for (const row of rows) {
      const digits = String(row.phone || "").replace(/\D/g, ""), mk = digits.startsWith("55") && digits.length >= 12 ? "BR" : "PT", phone = normPhone(row.phone, mk);
      const exists = S.leads.some(l => l.remoteId === row.id), blocked = S.optout.some(o => o.phone && phone && o.phone === phone);
      if (!exists && !blocked) {
        S.leads.push({ id: uid(), remoteId: row.id, inbound: true, name: row.name, email: row.email, phone, market: mk, lang: row.lang || "pt", need: row.need || "", company: row.company || "", inboundMsg: row.message, segment: guessSeg(row.company || ""), signals: ["inbound"], status: "novo", followups: 0, created: (row.created_at || "").slice(0, 10) || today(), source: "", notes: "" });
        added++;
      }
      await fetch(url + "/rest/v1/inbound_leads?id=eq." + encodeURIComponent(row.id), { method: "PATCH", headers: Object.assign({ Prefer: "return=minimal" }, H), body: JSON.stringify({ imported_at: new Date().toISOString() }) });
    }
    const d = new Date(); S.settings.lastSync = pad(d.getHours()) + ":" + pad(d.getMinutes()); save();
    if (added || manual) toast(added ? `${added} novo${added > 1 ? "s" : ""} pedido${added > 1 ? "s" : ""} do site.` : "Sem pedidos novos.");
  } catch (e) { if (manual || !/Falha|fetch/i.test(e.message)) toast(e.message); }
  finally { syncing = false; renderSync(); render(); }
}
function renderSync(){
  const b = $("#syncBtn"); if (!b) return; const { key } = sbCfg(), s = getSess();
  b.textContent = !key ? "Site: não ligado" : !s ? "Site: sem sessão" : "Site: ligado · sync " + (S.settings.lastSync || "—") + " ↻";
  b.onclick = () => { if (key && s) syncInbound(true); else { ui.tab = "config"; render(); } };
  const st = $("#sbStatus"); if (st) st.textContent = !key ? "Ainda não ligado. Cole a chave pública do projeto e entre." : !s ? "Chave guardada. Falta entrar com o e-mail e a palavra-passe." : "Ligado como " + (s.email || "utilizador") + ". Os pedidos do site entram sozinhos em 'Hoje'.";
}
function bindSync(){
  renderSync();
  const g = (id, fn) => { const e = $("#" + id); if (e) e.onclick = fn; };
  g("sbLogin", async () => {
    S.settings.sbUrl = $("#sbUrl").value.trim() || SB_DEFAULT_URL; S.settings.sbKey = $("#sbKey").value.trim(); S.settings.sbEmail = $("#sbEmail").value.trim(); save();
    try { await sbLogin(S.settings.sbEmail, $("#sbPass").value); $("#sbPass").value = ""; toast("Sessão iniciada."); renderSync(); await syncInbound(true); }
    catch (e) { toast(e.message); }
  });
  g("sbSync", () => syncInbound(true));
  g("sbLogout", logout);
}

/* ============ login e arranque ============ */
function showGate(msg){
  const g = $("#gate"); g.classList.remove("hidden");
  if (!$("#gateForm")) location.reload();
  $("#gErr").textContent = msg || ""; const em = $("#gEmail"); if (!em.value) em.value = (getSess() || {}).email || S.settings.sbEmail || ""; (em.value ? $("#gPass") : em).focus();
}
async function logout(){
  clearTimeout(pushTimer); dirty = true; try { await push(); } catch (e) {}
  putSess(null); location.reload();
}
function startApp(){
  $("#gate").classList.add("hidden"); setSaveState("", "Guardado");
  if (started) { if (dirty) push(); return; }
  started = true;
  $$("#tabs button").forEach(b => b.onclick = () => { ui.tab = b.dataset.t; ui.showAll = false; render(); });
  migrate();
  $("#dlg").addEventListener("close", () => $("#dlg").classList.remove("wide"));
  render();
  $("#qcBtn").onclick = () => { ui.tab = "fontes"; render(); const e = $("#qcLink"); if (e) e.focus(); };
  $("#outBtn").onclick = logout;
  renderSync();
  $("#briefBtn").onclick = showBrief;
  Promise.race([syncInbound(false), new Promise(r => setTimeout(r, 4000))]).catch(() => {}).finally(() => setTimeout(maybeBrief, 400));
  setInterval(() => { if (started && !locked) syncInbound(false); }, 5 * 60 * 1000);
  addEventListener("focus", () => { if (started && !locked) { syncInbound(false); if (housekeeping()) render(); } });
  addEventListener("beforeunload", e => { if (dirty || pushing) { e.preventDefault(); e.returnValue = ""; } });
  setTimeout(() => autoRadar(false), 1500);
}
$("#gateForm").addEventListener("submit", async e => {
  e.preventDefault(); const btn = $("#gBtn"), err = $("#gErr"); btn.disabled = true; btn.textContent = "A entrar…"; err.textContent = "";
  try {
    await sbLogin($("#gEmail").value.trim(), $("#gPass").value); $("#gPass").value = "";
    if (!started) await loadRemote();
    startApp();
  } catch (x) { err.textContent = /Failed to fetch|NetworkError/i.test(x.message) ? "Sem ligação à internet." : x.message; }
  finally { btn.disabled = false; btn.textContent = "Entrar"; }
});
(async function boot(){
  if (!getSess()) return showGate();
  try { await loadRemote(); startApp(); }
  catch (x) { showGate(/sess/i.test(x.message) ? "" : x.message); }
})();
